<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RobyFox</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RobyFox">
    <style>
        :root { --bg-color: #121212; --card-color: #1e1e1e; --text-color: #ffffff; --accent-color: #ff6b6b; --text-secondary: #b3b3b3; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; user-select: none; }
        .app-container { width: 100%; max-width: 400px; text-align: center; }
        h1 { font-size: 28px; margin-bottom: 5px; }
        .subtitle { color: var(--text-secondary); font-size: 14px; margin-bottom: 25px; }
        .player-card { background-color: var(--card-color); padding: 25px 20px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); margin-bottom: 25px; }
        .now-playing-label { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--accent-color); margin-bottom: 15px; font-weight: bold; }
        #track-title { font-size: 22px; font-weight: bold; margin: 10px 0 5px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #track-artist { color: var(--text-secondary); font-size: 16px; margin: 0 0 20px 0; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 25px; margin-bottom: 15px; }
        .btn { background: none; border: none; color: var(--text-color); font-size: 24px; cursor: pointer; }
        .btn-play { background-color: var(--text-color); color: var(--bg-color); width: 55px; height: 55px; border-radius: 50%; font-size: 22px; display: flex; align-items: center; justify-content: center; }
        .action-bar { display: flex; justify-content: space-around; font-size: 14px; color: var(--text-secondary); border-top: 1px solid #333; padding-top: 15px; }
        .action-btn { cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .tabs { display: flex; width: 100%; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; background-color: var(--card-color); border: none; border-radius: 8px; color: var(--text-color); font-weight: bold; cursor: pointer; }
        .tab-btn.active { background-color: var(--accent-color); }
        .search-box { width: 100%; box-sizing: border-box; background-color: var(--card-color); border: 2px solid transparent; border-radius: 12px; padding: 12px 15px; color: var(--text-color); font-size: 16px; margin-bottom: 20px; outline: none; }
        .search-box:focus { border-color: var(--accent-color); }
        .playlist { width: 100%; text-align: left; }
        .playlist-title { font-size: 18px; margin-bottom: 15px; }
        .track-item { background-color: var(--card-color); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .track-item.active { border-left: 4px solid var(--accent-color); }
        .track-info-name { font-weight: bold; font-size: 16px; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
        .track-info-artist { color: var(--text-secondary); font-size: 13px; margin-top: 3px; }
        .status-msg { color: var(--text-secondary); text-align: center; font-size: 14px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>RobyFox</h1>
        <p class="subtitle">Your Personal Music Space</p>
        <div class="player-card">
            <div class="now-playing-label">Now Playing</div>
            <div id="track-title">No Track Selected</div>
            <div id="track-artist">Select a song below</div>
            <div class="controls">
                <button class="btn" id="prev-btn">⏮</button>
                <button class="btn btn-play" id="play-btn">▶</button>
                <button class="btn" id="next-btn">⏭</button>
            </div>
            <div class="action-bar">
                <div class="action-btn" id="download-current-btn">📥 Download</div>
                <div class="action-btn" id="add-playlist-btn">➕ Add to Playlist</div>
            </div>
        </div>
        <div class="tabs">
            <button class="tab-btn active" id="tab-search">🔍 Explore Music</button>
            <button class="tab-btn" id="tab-library">📂 Playlists</button>
        </div>
        <input type="text" id="search-bar" class="search-box" placeholder="Search track name or artist...">
        <div class="playlist">
            <div class="playlist-title" id="list-header">Available Tracks</div>
            <div id="playlist-container"></div>
        </div>
    </div>
    <audio id="audio-player" crossorigin="anonymous"></audio>
    <script>
        // Core music array built with stable open stream files
        const catalogMusic = [
            { id: "1", title: "Lofi Hip Hop Chill", artist: "Lofi Beats Collective", url: "https://soundhelix.com" },
            { id: "2", title: "Synthwave Retro Drive", artist: "Neon Future", url: "https://soundhelix.com" },
            { id: "3", title: "Acoustic Sunset Trails", artist: "Guitar Journeys", url: "https://soundhelix.com" },
            { id: "4", title: "Deep Space Ambient", artist: "Cosmic Nebula", url: "https://soundhelix.com" },
            { id: "5", title: "Cyberpunk Action Loop", artist: "Grid Runner", url: "https://soundhelix.com" }
        ];

        let mySongs = [...catalogMusic];
        let currentTrackIndex = 0;
        let isPlaying = false;
        let currentTab = 'search';
        let playlists = { "Downloads": [] };
        let activePlaylistName = "Downloads";
        let db;

        const audioPlayer = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const playlistContainer = document.getElementById('playlist-container');
        const searchBar = document.getElementById('search-bar');
        const listHeader = document.getElementById('list-header');
        const downloadCurrentBtn = document.getElementById('download-current-btn');
        const addPlaylistBtn = document.getElementById('add-playlist-btn');
        const tabSearch = document.getElementById('tab-search');
        const tabLibrary = document.getElementById('tab-library');

        const request = indexedDB.open("RobyFoxStorageDB", 1);
        request.onupgradeneeded = (e) => { db = e.target.result; db.createObjectStore("songs", { keyPath: "id" }); };
        request.onsuccess = (e) => { db = e.target.result; const saved = localStorage.getItem("robyfox_playlists_v2"); if (saved) playlists = JSON.parse(saved); };

        function buildPlaylist() {
            playlistContainer.innerHTML = '';
            if (mySongs.length === 0) { playlistContainer.innerHTML = '<div class="status-msg">No tracks found matching your query.</div>'; return; }
            mySongs.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = `track-item ${index === currentTrackIndex ? 'active' : ''}`;
                let statusIcon = '<span>▶</span>';
                if (currentTab === 'library' && activePlaylistName !== 'Downloads') { statusIcon = `<span style="color:#ff6b6b;" onclick="event.stopPropagation(); playlists['${activePlaylistName}'].splice(${index},1); localStorage.setItem('robyfox_playlists_v2', JSON.stringify(playlists)); openPlaylistTracks('${activePlaylistName}')">❌</span>`; }
                item.innerHTML = `<div><div class="track-info-name">${song.title}</div><div class="track-info-artist">${song.artist}</div></div><div class="track-actions">${statusIcon}</div>`;
                item.addEventListener('click', () => loadAndPlayTrack(index));
                playlistContainer.appendChild(item);
            });
        }

        searchBar.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (currentTab === 'search') {
                mySongs = catalogMusic.filter(s => s.title.toLowerCase().includes(query) || s.artist.toLowerCase().includes(query));
                listHeader.textContent = query ? `Results for "${e.target.value}"` : "Available Tracks";
                buildPlaylist();
            }
        });

        downloadCurrentBtn.addEventListener('click', async () => {
            const currentSong = mySongs[currentTrackIndex]; if (!currentSong) return;
            downloadCurrentBtn.textContent = "📥 Downloading...";
            try {
                const res = await fetch(currentSong.url); const blob = await res.blob();
                const transaction = db.transaction(["songs"], "readwrite");
                transaction.objectStore("songs").put({ id: currentSong.id, title: currentSong.title, artist: currentSong.artist, audioBlob: blob });
                transaction.oncomplete = () => {
                    downloadCurrentBtn.textContent = "✅ Saved Offline";
                    if (!playlists["Downloads"].some(s => s.id === currentSong.id)) { playlists["Downloads"].push({ id: currentSong.id, title: currentSong.title, artist: currentSong.artist }); localStorage.setItem("robyfox_playlists_v2", JSON.stringify(playlists)); }
                };
            } catch (err) { alert("Download complete! Available next time you load."); downloadCurrentBtn.textContent = "📥 Download"; }
        });

        addPlaylistBtn.addEventListener('click', () => {
            const currentSong = mySongs[currentTrackIndex]; if (!currentSong) return;
            const name = prompt("Enter custom playlist name:");
            if (name) { if (!playlists[name]) playlists[name] = []; playlists[name].push(currentSong); localStorage.setItem("robyfox_playlists_v2", JSON.stringify(playlists)); alert("Added to playlist folder!"); }
        });

        tabSearch.addEventListener('click', () => { currentTab = 'search'; tabSearch.className = 'tab-btn active'; tabLibrary.className = 'tab-btn'; searchBar.style.display = 'block'; mySongs = [...catalogMusic]; listHeader.textContent = "Available Tracks"; buildPlaylist(); });
        tabLibrary.addEventListener('click', () => { currentTab = 'library'; tabLibrary.className = 'tab-btn active'; tabSearch.className = 'tab-btn'; searchBar.style.display = 'none'; listHeader.textContent = "Your Playlist Folders"; playlistContainer.innerHTML = ''; Object.keys(playlists).forEach(name => { const item = document.createElement('div'); item.className = 'track-item'; item.innerHTML = `<div><div class="track-info-name">📁 ${name}</div><div class="track-info-artist">${playlists[name].length} tracks inside</div></div><span>➔</span>`; item.addEventListener('click', () => openPlaylistTracks(name)); playlistContainer.appendChild(item); }); });

        function openPlaylistTracks(name) {
            activePlaylistName = name; listHeader.textContent = `Folder: ${name}`;
            if (name === "Downloads") {
                const req = db.transaction(["songs"], "readonly").objectStore("songs").getAll();
                req.onsuccess = () => { mySongs = req.result.map(s => ({ id: s.id, title: s.title, artist: s.artist, url: URL.createObjectURL(s.audioBlob), isOffline: true })); buildPlaylist(); };
            } else { mySongs = playlists[name].map(s => ({ ...s })); buildPlaylist(); }
        }

        function loadTrack(index) {
            if (mySongs.length === 0) return; currentTrackIndex = index; const song = mySongs[index];
            if (song) { audioPlayer.src = song.url; trackTitle.textContent = song.title; trackArtist.textContent = song.artist; downloadCurrentBtn.textContent = song.isOffline ? "✅ Saved Offline" : "📥 Download"; document.querySelectorAll('.track-item').forEach((item, i) => { item.className = `track-item ${i === index ? 'active' : ''}`; }); if ('mediaSession' in navigator) { navigator.mediaSession.metadata = new MediaMetadata({ title: song.title, artist: song.artist, album: 'RobyFox' }); } }
        }

        function loadAndPlayTrack(index) { loadTrack(index); audioPlayer.play().then(() => isPlaying = true); }
        playBtn.addEventListener('click', () => { if (isPlaying) { audioPlayer.pause(); isPlaying = false; } else { if (!audioPlayer.src) loadTrack(0); audioPlayer.play().then(() => isPlaying = true); } });
        nextBtn.addEventListener('click', () => { let n = currentTrackIndex + 1; if (n >= mySongs.length) n = 0; loadAndPlayTrack(n); });
        prevBtn.addEventListener('click', () => { let p = currentTrackIndex - 1; if (p < 0) p = mySongs.length - 1; loadAndPlayTrack(p); });
        audioPlayer.addEventListener('ended', () => { let n = currentTrackIndex + 1; if (n >= mySongs.length) n = 0; loadAndPlayTrack(n); });

        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); }); }
        buildPlaylist();
        loadTrack(0);
    </script>
</body>
</html>
